name: Release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.13']
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the built wheel
        run: python -c "import pathlib, subprocess, sys; subprocess.run([sys.executable, '-m', 'pip', 'install', str(next(pathlib.Path('dist').glob('*.whl')))], check=True)"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_install.py
      - name: Install the source distribution
        run: python -c "import pathlib, subprocess, sys; subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', str(next(pathlib.Path('dist').glob('*.tar.gz')))], check=True)"
      - run: python scripts/verify_install.py
      - run: repopulse . --fail-under 100 --fail-on warning
  browser:
    name: Standalone HTML / Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install .
      - run: npm install --no-save --prefix .repopulse/browser playwright@1.62.1
      - run: node .repopulse/browser/node_modules/playwright/cli.js install --with-deps chromium
      - run: node scripts/verify_browser.cjs .repopulse/browser-results
        env:
          REPOPULSE_PLAYWRIGHT_MODULE: ${{ github.workspace }}/.repopulse/browser/node_modules/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: .repopulse/browser-results
