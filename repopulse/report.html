<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-__SCRIPT_HASH__'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>RepoPulse report</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#242726;background:#f5f7f6;font-size:14px;line-height:1.5;--line:#d9dfdc;--green:#136d4c;--muted:#59635e}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,select{cursor:pointer}button:disabled{cursor:default;opacity:.5}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #209769;outline-offset:3px}a{color:var(--green);text-underline-offset:3px;overflow-wrap:anywhere}button{border:1px solid var(--line);border-radius:5px;background:white;color:#242726;padding:7px 12px}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}header strong{font-size:18px}header span{color:var(--muted);font-size:12px}main{max-width:1180px;margin:auto;padding:30px 28px 40px}h1{font-size:28px;line-height:1.25;margin:0;overflow-wrap:anywhere}h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:0 0 4px}p{margin:4px 0}.muted{color:var(--muted)}.overview{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start;margin-bottom:24px}.score{min-width:180px;border-left:1px solid var(--line);padding-left:24px}.score strong{font-size:28px;display:block}.score progress{width:100%;accent-color:var(--green);height:8px}.stats{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:14px}.stats strong{font-variant-numeric:tabular-nums}.projects{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.project{border:1px solid var(--line);background:#fff;border-radius:5px;padding:7px 10px;max-width:100%;overflow-wrap:anywhere}.languages{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted)}.basics{display:flex;flex-wrap:wrap;gap:8px 20px;margin:20px 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.pass{color:var(--green)}.miss{color:#a12a43}.off{color:var(--muted)}.notice{background:#fff3cd;border-left:3px solid #9c7500;padding:10px 14px;margin-bottom:12px;overflow-wrap:anywhere}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}.tabs button{border:0;border-radius:0;background:transparent;padding:12px 16px;border-bottom:3px solid transparent}.tabs button[aria-selected=true]{border-bottom-color:var(--green);color:var(--green);font-weight:650}.toolbar{display:flex;gap:10px;padding:16px 0;align-items:center}.toolbar label{display:flex;gap:8px;align-items:center}.toolbar input{width:100%;min-width:0;border:1px solid var(--line);border-radius:5px;padding:9px 12px;background:#fff}.search{flex:1;min-width:120px}select{max-width:100%;padding:9px;border:1px solid var(--line);border-radius:5px;background:#fff}.row{padding:16px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px}.badge{font-size:11px;font-weight:650;text-transform:uppercase;display:inline-block;padding:3px 7px;border-radius:4px;align-self:start;justify-self:start}.warning{background:#fff0bc;color:#725500}.error{background:#fde5ea;color:#a12a43}.info{background:#e1eee8;color:#245940}.row-body{min-width:0;overflow-wrap:anywhere}.location{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;display:block;margin:6px 0}.evidence{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;color:var(--muted);white-space:pre-wrap;margin:8px 0}.suggestion{margin-top:8px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:600}td:first-child{overflow-wrap:anywhere;min-width:170px}td:nth-child(2){white-space:nowrap;font-variant-numeric:tabular-nums}td:last-child{color:var(--muted)}.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}.pagination div{display:flex;gap:8px}.empty{padding:40px 12px;text-align:center;color:var(--muted)}footer{margin-top:28px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:14px}[hidden]{display:none!important}
@media(max-width:640px){header{padding:14px 16px}header span{max-width:150px;text-align:right}main{padding:22px 16px}.overview{grid-template-columns:minmax(0,1fr);gap:14px}.score{border-left:0;padding-left:0;min-width:0;max-width:240px}.score strong{display:inline;font-size:24px}.score progress{display:block}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.toolbar label{flex:1}select{width:100%}.row{grid-template-columns:minmax(0,1fr);gap:8px}.tabs button{padding:12px 10px}.pagination{font-size:12px}.pagination button{padding:7px 9px}th,td{padding:10px}.stats{gap:8px 14px}}
</style>
<style>
.overview>div{min-width:0}.tabs{flex-wrap:wrap}.toolbar select{min-width:0}
@media(max-width:640px){.toolbar label{flex:0 1 auto;min-width:0}.toolbar label.search{flex:1 1 100%;min-width:0}.toolbar select{width:auto}}
</style>
</head>
<body>
<header><strong>RepoPulse</strong><span>Local repository report</span></header>
<main>
<section class="overview" aria-label="Repository overview">
<div><h1 id="project"></h1><p class="muted" id="scope"></p><div class="stats" id="stats"></div><div class="projects" id="projects"></div><div class="languages" id="languages"></div></div>
<div class="score"><span class="muted">Repository basics</span><strong id="score"></strong><progress id="progress" max="100" aria-label="Readiness score"></progress><span class="muted">Presence checks, not code quality</span></div>
</section>
<div class="basics" id="basics" aria-label="Repository checks"></div>
<div id="warnings" role="status"></div>
<div class="tabs" role="tablist" aria-label="Report views">
<button id="tab-findings" type="button" role="tab" aria-selected="true" aria-controls="results">Findings</button>
<button id="tab-files" type="button" role="tab" aria-selected="false" aria-controls="results" tabindex="-1">Files</button>
<button id="tab-markers" type="button" role="tab" aria-selected="false" aria-controls="results" tabindex="-1">Markers</button>
<button id="tab-changes" type="button" role="tab" aria-selected="false" aria-controls="results" tabindex="-1">Changes</button>
</div>
<div class="toolbar">
<label class="search"><input id="search" type="search" aria-label="Search report" placeholder="Search paths or findings"></label>
<label><span class="muted">Severity</span><select id="severity"><option value="all">All</option><option value="error">Error</option><option value="warning">Warning</option><option value="info">Info</option></select></label>
<label id="sort-label" hidden><span class="muted">Sort</span><select id="sort"><option value="name">Path</option><option value="size">Largest first</option></select></label>
</div>
<div id="change-summary" class="muted" hidden></div>
<div id="results" role="tabpanel" aria-labelledby="tab-findings"></div>
<div class="pagination"><span id="result-count" role="status" aria-live="polite"></span><div><button type="button" id="previous">Previous</button><button type="button" id="next">Next</button></div></div>
<footer id="footer"></footer>
</main>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>__REPORT_SCRIPT__</script>
</body>
</html>
